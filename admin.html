<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت | ARASH DEV</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
.wrap {
  max-width: 850px;
  margin: 45px auto;
  padding: 0 18px;
}

.box {
  background: #111b29;
  border: 1px solid #ffffff18;
  padding: 25px;
  border-radius: 13px;
  margin-bottom: 20px;
}

.field {
  display: grid;
  gap: 7px;
  margin: 13px 0;
}

.field label {
  font-size: 13px;
  color: #afc0d2;
}

.field input,
.field textarea,
.field select {
  background: #080e17;
  border: 1px solid #2b4058;
  border-radius: 8px;
  padding: 11px;
  color: white;
  font: inherit;
  width: 100%;
  box-sizing: border-box;
}

.field textarea {
  min-height: 80px;
}

.btn {
  background: #2089d8;
  border: 0;
  border-radius: 8px;
  padding: 11px 18px;
  color: white;
  font: inherit;
  cursor: pointer;
  margin: 4px;
}

.btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.gray {
  background: #34445a;
}

.red {
  background: #a33d4c;
}

.hidden {
  display: none !important;
}

.item {
  border-top: 1px solid #ffffff18;
  padding: 14px 0;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.item small {
  display: block;
  color: #91a2b7;
}

.hint {
  background: #0b263b;
  padding: 12px;
  border-radius: 8px;
  color: #b5ddff;
  font-size: 12px;
}

.status {
  color: #69baff;
  font-size: 13px;
  min-height: 25px;
  margin-top: 12px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">A <b>ARASH DEV</b></a>
  <a class="ig" href="index.html">مشاهده سایت ↗</a>
</header>

<main class="wrap">

<div class="box">

<small>PRIVATE ADMIN</small>
<h1>مدیریت نمونه‌کارها</h1>

<p class="hint">
این صفحه مخصوص مدیر سایت ARASH DEV است.
</p>

<!-- LOGIN -->

<div id="login">
  <p id="loginStatus" style="color:#69baff;margin-top:15px"></p>

  <div class="field">
    <label>ایمیل مدیر</label>
    <input id="email" type="email" autocomplete="username">
  </div>

  <div class="field">
    <label>رمز عبور</label>
    <input id="pass" type="password" autocomplete="current-password">
  </div>

  <button class="btn" id="loginBtn" type="button">
    ورود به پنل مدیریت
  </button>

  <div id="loginStatus" class="status"></div>

</div>

<!-- EDITOR -->

<div id="editor" class="hidden">

  <button class="btn gray" id="logout" type="button">
    خروج
  </button>

  <h2>افزودن / ویرایش پروژه</h2>

  <form id="form">

    <input id="pid" type="hidden">

    <div class="field">
      <label>نام پروژه *</label>
      <input id="title" required>
    </div>

    <div class="field">
      <label>دسته‌بندی</label>
      <select id="category">
        <option value="website">وب‌سایت</option>
        <option value="desktop">نرم‌افزار</option>
        <option value="other">سایر</option>
      </select>
    </div>

    <div class="field">
      <label>توضیح کوتاه *</label>
      <textarea id="description" required></textarea>
    </div>

    <div class="field">
      <label>توضیحات کامل</label>
      <textarea id="details"></textarea>
    </div>

    <div class="field">
      <label>لینک پروژه</label>
      <input id="url" type="url">
    </div>

    <div class="field">
      <label>عکس کاور</label>
      <input id="cover" type="file" accept="image/*">
    </div>

    <div class="field">
      <label>عکس‌های بیشتر</label>
      <input id="gallery" type="file" accept="image/*" multiple>
    </div>

    <div class="field">
      <label>
        <input id="published" type="checkbox" checked>
        انتشار عمومی
      </label>
    </div>

    <button class="btn" type="submit">
      ذخیره پروژه
    </button>

    <button class="btn gray" type="button" id="reset">
      فرم جدید
    </button>

  </form>

  <div id="status" class="status"></div>

  <h2>پروژه‌های ثبت‌شده</h2>

  <div id="list"></div>

</div>

</div>
</main>

<script src="config.js"></script>
<script src="admin.js"></script>

</body>
</html>
